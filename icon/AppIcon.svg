  </g>

  <rect x="101.5" y="101.5" width="821" height="821" rx="183.5" fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="3"/>

  <g transform="translate(0,9)" opacity="0.5" filter="url(#gshadow)">
    <g fill="none" stroke="#000000" stroke-width="84" stroke-linecap="round">
